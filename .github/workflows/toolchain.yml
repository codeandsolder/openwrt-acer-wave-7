name: Build Toolchains

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-toolchains:
    name: Build Toolchains for each target
    permissions:
      contents: read
      packages: read
      actions: write
    uses: openwrt/actions-shared-workflows/.github/workflows/toolchain.yml@146858c0e56cca16c97ad67fbe2ea44ebe8a2e9a