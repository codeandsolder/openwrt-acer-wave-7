name: Build Kernel

on:
  pull_request:
    paths:
      - '.github/workflows/check-kernel-patches.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/kernel.yml'
      - 'include/kernel*'
      - 'package/kernel/**'
      - 'target/linux/**'
  push:
    paths:
      - '.github/workflows/check-kernel-patches.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/kernel.yml'
      - 'include/kernel*'
      - 'package/kernel/**'
      - 'target/linux/**'
    branches: [main]
  # Explicit full-tree validation remains available. Routine CI validates
  # the board this fork is developed for, not hundreds of upstream platforms.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wave7-kernel:
    name: Build Wave 7 kernel and kmods
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
      actions: write
    uses: openwrt/actions-shared-workflows/.github/workflows/reusable_build.yml@146858c0e56cca16c97ad67fbe2ea44ebe8a2e9a
    with:
      container_name: toolchain
      target: qualcommbe
      subtarget: ipq53xx
      build_kernel: true
      build_all_kmods: true
      build_dtb: true

  wave7-patches:
    name: Check Wave 7 kernel patches
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: openwrt/actions-shared-workflows/.github/workflows/reusable_check-kernel-patches.yml@146858c0e56cca16c97ad67fbe2ea44ebe8a2e9a
    with:
      target: qualcommbe
      subtarget: ipq53xx

  full-kernel-matrix:
    name: Build all upstream kernels (explicit full validation)
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
      actions: write
    secrets:
      ccache_s3_endpoint: ${{ secrets.CCACHE_S3_ENDPOINT }}
      ccache_s3_bucket: ${{ secrets.CCACHE_S3_BUCKET }}
      ccache_s3_access_key: ${{ secrets.CCACHE_S3_ACCESS_KEY }}
      ccache_s3_secret_key: ${{ secrets.CCACHE_S3_SECRET_KEY }}
    uses: openwrt/actions-shared-workflows/.github/workflows/kernel.yml@146858c0e56cca16c97ad67fbe2ea44ebe8a2e9a
