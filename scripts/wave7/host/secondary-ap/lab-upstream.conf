# Isolated Asus direct Wave7 link ONLY; not a production DHCP server.
# No DNS listener, no IPv4 default route/DNS and no IPv6 default router.
port=0
interface=enp4s0f4u2u4
except-interface=lo
bind-interfaces
no-resolv
no-hosts
dhcp-authoritative
dhcp-range=192.168.76.100,192.168.76.149,255.255.255.0,5m
dhcp-host=70:5a:6f:5a:bb:14,192.168.76.1,5m
dhcp-option=option:router
dhcp-option=option:dns-server
log-dhcp
enable-ra
dhcp-range=fd76:7::,ra-only,64,5m
ra-param=enp4s0f4u2u4,10,0
dhcp-option=option6:dns-server
